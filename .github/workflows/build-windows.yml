name: build-windows
# GOGABox for WINDOWS - the template forge + the two exe builds.
#
# THE SSE2 BASELINE LAW (the owner): modern Godot x86_64 builds require
# SSE4.2 (Haswell+). The box must run on older CPUs, so the export templates
# are FORGED from the pinned Godot source with:
#   scons platform=windows target=template_release arch=x86_64 lto=full \
#       use_static_cpp=yes custom_cflags="-march=x86-64" \
#       custom_cxxflags="-march=x86-64"
# ...and the SAME for arch=x86 (the 32-bit build). The forge asserts the
# produced template carries NO SSE4.2-only instructions (objdump probe).
#
# TWO builds ship: GOGABox_x64.exe (x86_64) + GOGABox_x86.exe (32-bit),
# each a SINGLE .exe (the pck is embedded), zipped with max compression.
#
# Run manually from the Actions tab (maturity first - see docs/CI.md):
#   - "Forge templates only"  -> builds + checks the two templates
#   - "Forge + export"        -> also exports both exes

on:
  workflow_dispatch:
    inputs:
      run_export:
        description: "After the forge, export GOGABox_x64.exe + GOGABox_x86.exe"
        required: false
        default: true
        type: boolean

concurrency:
  group: build-windows
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  # ============================================================ the forge
  forge-x64:
    name: Forge template x86_64 (SSE2 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils mingw-w64-tools
          python3 -m pip install --quiet scons
      - name: Fetch the pinned Godot source
        run: |
          curl -L -o godot-src.tar.gz \
            "https://github.com/godotengine/godot/archive/refs/tags/${GODOT_VERSION}-${GODOT_RELEASE}.tar.gz"
          tar -xzf godot-src.tar.gz
          cd "godot-${GODOT_VERSION}-${GODOT_RELEASE}"
          # THE BASELINE LAW: the owner's line - -march=x86-64 (generic SSE2)
          # overrides any newer default, so pre-Haswell CPUs can run the box.
          # d3d12/winrt/accesskit=no: the box renders GL Compatibility - the
          # optional drivers' SDKs are not needed for this forge
          scons platform=windows target=template_release arch=x86_64 \
            lto=full use_static_cpp=yes debug_symbols=no \
            d3d12=no winrt=no accesskit=no \
            custom_cflags="-march=x86-64" custom_cxxflags="-march=x86-64" \
            -j"$(nproc)"
      - name: THE SSE2 LAW - no SSE4.2-only instructions in the template
        run: |
          BIN="godot-${GODOT_VERSION}-${GODOT_RELEASE}/bin/windows_release_x86_64.exe"
          ls -la "$(dirname "$BIN")"
          if objdump -d "$BIN" | grep -E "pcmpgtq|pcmpestr|pcmpestri|phminposuw|crc32|aesenc" ; then
            echo "::error::SSE4.2/AES-only instructions found - the template is NOT SSE2-baseline"
            exit 1
          else
            echo "OK: no SSE4.2-only mnemonics - the x86_64 template runs on SSE2 CPUs"
          fi
      - name: Upload the x86_64 template
        uses: actions/upload-artifact@v4
        with:
          name: godot-template-win64
          path: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/bin/windows_release_x86_64.exe
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/bin/windows_release_x86_64.pck
          retention-days: 30

  forge-x86:
    name: Forge template x86 (32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils mingw-w64-tools
          python3 -m pip install --quiet scons
      - name: Fetch the pinned Godot source
        run: |
          curl -L -o godot-src.tar.gz \
            "https://github.com/godotengine/godot/archive/refs/tags/${GODOT_VERSION}-${GODOT_RELEASE}.tar.gz"
          tar -xzf godot-src.tar.gz
          cd "godot-${GODOT_VERSION}-${GODOT_RELEASE}"
          scons platform=windows target=template_release arch=x86 \
            lto=full use_static_cpp=yes debug_symbols=no \
            d3d12=no winrt=no accesskit=no \
            custom_cflags="-march=x86-64" custom_cxxflags="-march=x86-64" \
            -j"$(nproc)"
      - name: Upload the x86 template
        uses: actions/upload-artifact@v4
        with:
          name: godot-template-win32
          path: |
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/bin/windows_release_x86.exe
            godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/bin/windows_release_x86.pck
          retention-days: 30

  # ============================================================ the export
  export-windows:
    name: Export GOGABox_x64.exe + GOGABox_x86.exe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [forge-x64, forge-x86]
    if: ${{ inputs.run_export }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the editor
        run: |
          curl -L -o godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -qo godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v*.x86_64
          ./godot-editor/Godot_v*.x86_64 --version

      - name: Seat the forged templates
        uses: actions/download-artifact@v4
        with:
          pattern: godot-template-win*
          merge-multiple: true
          path: tpl

      - name: Install the templates where the editor looks
        run: |
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          cp tpl/windows_release_x86_64.exe tpl/windows_release_x86_64.pck \
             tpl/windows_release_x86.exe tpl/windows_release_x86.pck \
             "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          ls -la "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Materialize the project (plugins + config)
        run: bash .ci/materialize-project.sh gogabox

      - name: Import
        run: ./godot-editor/Godot_v*.x86_64 --headless --path projects/gogabox --import

      - name: Export the two single-file exes
        run: |
          mkdir -p projects/build
          ./godot-editor/Godot_v*.x86_64 --headless --path projects/gogabox \
            --export-release "Windows x86_64" ../build/GOGABox_x64.exe
          ./godot-editor/Godot_v*.x86_64 --headless --path projects/gogabox \
            --export-release "Windows x86_32" ../build/GOGABox_x86.exe
          ls -la projects/build/

      - name: Compress (the single-zip delivery)
        run: |
          V="$(jq -r '.projects.gogabox.version_name' config/projects.json)"
          mkdir -p stage
          cp projects/build/GOGABox_x64.exe projects/build/GOGABox_x86.exe stage/
          printf "GOGABox %s for Windows\r\n\r\nGOGABox_x64.exe - 64-bit, runs on any SSE2 CPU (no SSE4.2 needed)\r\nGOGABox_x86.exe - 32-bit fallback\r\nSingle file - everything is embedded.\r\n" "$V" > stage/README.txt
          cd stage && zip -9 "../GOGABox-windows-${V}.zip" GOGABox_x64.exe GOGABox_x86.exe README.txt
          cd .. && ls -la "GOGABox-windows-${V}.zip"
          mv "GOGABox-windows-${V}.zip" stage/
      - name: Upload the delivery
        uses: actions/upload-artifact@v4
        with:
          name: GOGABox-windows
          path: |
            stage/GOGABox_x64.exe
            stage/GOGABox_x86.exe
            stage/README.txt
            stage/GOGABox-windows-*.zip
          retention-days: 30
