name: goga-registry
# THE TWO-STEP PUBLISH'S CI (developers/PUBLISHING.md): a PR adds one
# repo line to GOGAs/discover/REPOS.txt; this workflow fetches the repo's
# raw source.json + game indexes and refuses anything that does not wear
# the contract. Merge = the community tier.
on:
  pull_request:
    paths:
      - "GOGAs/discover/REPOS.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the PR's added repos
        run: |
          REPOS=$(git diff origin/${{ github.base_ref }}...HEAD -- GOGAs/discover/REPOS.txt | grep '^+' | grep -v '^+++' | sed 's/^+//' | grep -v '^\s*#' | tr -d ' \r' || true)
          if [ -z "$REPOS" ]; then
            echo "no repo lines added - nothing to validate"
            exit 0
          fi
          python3 tools/goga_ci_validate.py repos $REPOS
      - name: The tree keeps wearing the contract
        run: python3 tools/goga_ci_validate.py tree
