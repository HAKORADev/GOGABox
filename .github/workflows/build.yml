name: build
# GOGABox (Godot all-in-one Game box) - THE ONE BUILD ACTION.
#
# THE ONE BUILD LAW (the windows return, the owner's open-source round):
# ONE action builds BOTH platforms.
#   - push to main:            APKs (all ABIs) + THE Windows exe
#   - manual run (Actions UI): pick ABI / build type, optionally publish a release
#
# THE WINDOWS LAW: no template forging. The SAME official Godot the Android
# build uses (4.7.2-stable) + the SAME official export templates tpz, from
# which only the two 32-bit Windows files are seated. ONE exe ships:
#   GOGABox.exe (x86_32) - runs on EVERY Windows: 32-bit natively, 64-bit
#   through WOW64. There is no 64-bit build anymore. The official i386
#   Windows templates are SSE2-baseline: they run on pre-2014 CPUs with
#   no SSE4.2 (the owner's whole point).
# The toolchain is pinned in config/environment.lock and cached, so the exe
# job takes minutes with a warm cache.
#
# THE 0-ADS LAW: the box ships ad-free on both platforms - there is no ad
# SDK, no ad config, no ad permissions anywhere in the pipeline.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project to build (key in config/projects.json)"
        required: true
        default: "gogabox"
        type: string
      abi:
        description: "ABI to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_release:
        description: "Attach APKs + the Windows zip to a GitHub release (tag v<version_name>)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "plugins/**"
      - "config/**"
      - ".ci/**"
      - "tools/**"
      - "build.sh"
      - ".github/workflows/build.yml"

# THE 0-WARNINGS LAW (v0.4.0-17, the owner's annotations report): the
# actions ride the Node 24 majors (checkout@v5, cache@v5, upload-artifact@v7,
# download-artifact@v8) and every job pins ubuntu-24.04 - ubuntu-latest would
# silently migrate to Ubuntu 26 in Oct 2026, a pinned label cannot move.

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate build matrix
        id: gen
        run: |
          matrix_json="$(bash .ci/ci-matrix.sh \
            --event "${{ github.event_name }}" \
            --project "${{ inputs.project || '' }}" \
            --abi "${{ inputs.abi || 'all' }}" \
            --build-type "${{ inputs.build_type || 'release' }}")"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "Build plan: $matrix_json"

  # ============================================================ the APKs
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore toolchain cache (JDK / Android SDK / Godot)
        uses: actions/cache@v5
        with:
          path: |
            .cache/jdk
            .cache/android-sdk
            .cache/godot
          key: toolchain-${{ runner.os }}-${{ hashFiles('config/environment.lock') }}

      - name: Restore gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('projects/**/build.gradle', 'projects/**/config.gradle', 'projects/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bootstrap toolchain (idempotent)
        run: ./tools/bootstrap.sh

      - name: Build ${{ matrix.project }} (${{ matrix.abi }}, ${{ matrix.build_type }})
        run: ./build.sh "${{ matrix.project }}" --abi "${{ matrix.abi }}" --type "${{ matrix.build_type }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.abi }}-${{ matrix.build_type }}
          path: dist/${{ matrix.project }}/*.apk
          if-no-files-found: error

      - name: Append build summary
        if: always()
        run: |
          if [ -f "dist/${{ matrix.project }}/BUILD_SUMMARY.md" ]; then
            cat "dist/${{ matrix.project }}/BUILD_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================ THE exe
  windows:
    # THE ONE BUILD LAW: GOGABox.exe (32-bit), official templates, minutes
    # not hours. No forge, no 64-bit preset, no surprises.
    name: Windows exe (x86_32, the one build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Restore the Windows toolchain cache (editor + the 32-bit templates)
        uses: actions/cache@v5
        with:
          path: .cache/godot-win
          key: win-toolchain-${{ runner.os }}-${{ hashFiles('config/environment.lock') }}

      - name: Install the official editor + seat the official 32-bit templates
        run: |
          set -euo pipefail
          V="$(jq -r '.godot.version' config/environment.lock)"
          R="$(jq -r '.godot.release' config/environment.lock)"
          DIR=".cache/godot-win"
          mkdir -p "$DIR/bin" "$DIR/templates"
          # --- the editor (the same one the Android build bootstraps)
          if [ ! -x "$DIR/bin/godot" ] || ! "$DIR/bin/godot" --version 2>/dev/null | grep -q "$V"; then
            echo "downloading the Godot $V editor ..."
            curl -fSL --retry 2 -o "$DIR/editor.zip" \
              "https://github.com/godotengine/godot/releases/download/${V}-${R}/Godot_v${V}-${R}_linux.x86_64.zip"
            unzip -qo "$DIR/editor.zip" -d "$DIR/extract"
            find "$DIR/extract" -name 'Godot_*linux.x86_64*' -type f -exec mv {} "$DIR/bin/godot" \;
            rm -rf "$DIR/extract" "$DIR/editor.zip"
            chmod +x "$DIR/bin/godot"
          fi
          "$DIR/bin/godot" --version
          # --- the official templates: only the two 32-bit Windows files
          if [ ! -f "$DIR/templates/windows_release_x86_32.exe" ]; then
            echo "downloading the export templates (one time, then cached) ..."
            curl -fSL --retry 2 -o "$DIR/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${V}-${R}/Godot_v${V}-${R}_export_templates.tpz"
            unzip -qo "$DIR/templates.tpz" \
              "templates/windows_release_x86_32.exe" \
              "templates/windows_release_x86_32_console.exe" \
              -d "$DIR/tmpex"
            mv "$DIR/tmpex/templates/"* "$DIR/templates/"
            rm -rf "$DIR/tmpex" "$DIR/templates.tpz"
          fi
          ls -la "$DIR/templates/"
          # --- seat them where the editor looks
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.${R}"
          cp "$DIR/templates/"* "$HOME/.local/share/godot/export_templates/${V}.${R}/"
          ls -la "$HOME/.local/share/godot/export_templates/${V}.${R}/"

      - name: Stage the shared plugin addons (the GDScript autoloads)
        run: |
          # the addons are NOT committed (gitignored) - the android flow
          # stages them in materialize-project.sh; the exe needs the same
          # GDScript side (notify.gd is a project autoload and a desktop
          # no-op by law)
          mkdir -p projects/gogabox/addons
          for plugin in $(jq -r '.projects.gogabox.use_plugins[]' config/projects.json); do
            ADDON_DIR="$(jq -r '.addon_dir' "plugins/$plugin/plugin.meta.json")"
            rm -rf "projects/gogabox/addons/$ADDON_DIR"
            cp -a "plugins/$plugin/addon" "projects/gogabox/addons/$ADDON_DIR"
            echo "staged addon: $ADDON_DIR"
          done
          ls projects/gogabox/addons/

      - name: Import the project
        run: .cache/godot-win/bin/godot --headless --path projects/gogabox --import

      - name: Export THE one exe (embedded pck, single file)
        run: |
          mkdir -p projects/build
          .cache/godot-win/bin/godot --headless --path projects/gogabox \
            --export-release "Windows x86_32" ../build/GOGABox.exe
          ls -la projects/build/

      - name: THE REAL-EXE LAW - it must be a 32-bit Windows GUI binary
        run: |
          F="projects/build/GOGABox.exe"
          file "$F"
          # file(1) wording differs across versions - match the FACTS not the order
          file "$F" | grep -q "PE32 executable" || { echo "::error::not a Windows PE32"; exit 1; }
          file "$F" | grep -Eq "Intel (i386|80386)" || { echo "::error::not the 32-bit (i386) build"; exit 1; }
          SZ="$(stat -c%s "$F")"
          [ "$SZ" -gt 50000000 ] || { echo "::error::exe suspiciously small ($SZ bytes) - the pck is missing"; exit 1; }
          echo "OK: a real i386 PE32 with the embedded game ($SZ bytes)"

      - name: Zip the delivery
        run: |
          V="$(jq -r '.projects.gogabox.version_name' config/projects.json)"
          mkdir -p stage
          cp projects/build/GOGABox.exe stage/
          printf "GOGABox %s for Windows\r\n\r\nGOGABox.exe - the ONE Windows build (32-bit).\r\nIt runs on EVERY Windows: 32-bit natively, 64-bit through WOW64.\r\nSingle file - everything is embedded. No installer needed.\r\n\r\nKEYS:\r\n  F11 or Alt+Enter - fullscreen / windowed\r\n  F10 - flip the menu position (vertical / horizontal)\r\n  ESC - the back button (pauses the game, closes sheets)\r\n  Up/Down - scroll the feed; Left/Right at the top scroll the\r\n    picks row; Tab+Left/Right switch the picks list\r\n  In games: the arrows play (WASD works too), and some games\r\n    use the mouse - check each game's guide page.\r\n\r\nThe settings menu wears AUDIO, SCREEN & GRAPHICS (fullscreen,\r\nposition, Dynamic Scale, GOGACursor) and CONTROLS.\r\n\r\nOpen source under the MIT license. Zero ads, fully offline.\r\n" "$V" > stage/README.txt
          cd stage && zip -9 "../GOGABox-windows-${V}.zip" GOGABox.exe README.txt
          cd .. && mv "GOGABox-windows-${V}.zip" stage/
          ls -la stage/

      # THE SMALL DELIVERY LAW (v0.4.0-17, the owner: "213 MBs ... x2.2 the
      # size of one apk ... there is something like compressing"): the
      # slim-pack rounds did their part - every wav source is ogg, every 2D
      # texture is lossless (tools/v0417_slim_*.py) - so the zip must stay
      # lean. The artifact ships THE ZIP ONLY: the raw exe inside it is the
      # engine (the official 32-bit template is ~116 MB of fixed
      # D3D12/ANGLE/Vulkan floor) + the game, and shipping both twice made
      # the old artifact ~360 MB. Guard: a re-fattened pack fails CI.
      - name: THE SMALL DELIVERY LAW - the zip is what ships and it stays lean
        run: |
          F="projects/build/GOGABox.exe"
          Z="$(ls stage/GOGABox-windows-*.zip | head -1)"
          ZS="$(stat -c%s "$Z")"
          ES="$(stat -c%s "$F")"
          [ "$ZS" -lt 175000000 ] || { echo "::error::the delivery re-fattened ($ZS bytes) - the slim-pack laws are being violated"; exit 1; }
          echo "THE DELIVERY: exe $ES bytes | zip $ZS bytes - the zip is what ships"
          echo "| delivery | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GOGABox.exe (engine + game, embedded) | $ES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GOGABox-windows zip (what ships) | $ZS |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Windows delivery
        uses: actions/upload-artifact@v7
        with:
          name: GOGABox-windows
          path: |
            stage/GOGABox-windows-*.zip
          if-no-files-found: error
          retention-days: 30

  # ============================================================ the release
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.projects["${{ inputs.project }}"].version_name' config/projects.json)"
          TAG="${{ inputs.project }}-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.zip --title "$TAG" --generate-notes
          fi
