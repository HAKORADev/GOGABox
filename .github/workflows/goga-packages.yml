name: goga-packages
# The official packages' CI: the committed GOGAs tree re-validates on
# every push that touches it, and a manual/release run rebuilds the
# dist .goga/.gogas bundles and attaches them to the release.
on:
  push:
    paths:
      - "GOGAs/**"
      - "packaging/**"
      - "tools/v043_package.py"
      - "tools/goga_ci_validate.py"
  workflow_dispatch:
    create_release:
      description: "attach the .goga bundles to a release"
      default: false
      type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/goga_ci_validate.py tree

  bundles:
    if: ${{ github.event.inputs.create_release == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dist bundles
        run: |
          mkdir -p GOGAs/dist
          for pkg in GOGAs/games/gogabox_github-*; do
            zip -qr "GOGAs/dist/$(basename "$pkg").goga" "$pkg"
          done
          zip -qr GOGAs/dist/official-pack.gogas GOGAs/games
      - uses: actions/upload-artifact@v4
        with:
          name: goga-bundles
          path: GOGAs/dist/
