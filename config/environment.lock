    "min_sdk": "24 (Android 7.0) covers ~97% of active devices and exceeds Unity Ads' minimum (API 21). Raising to 30+ would cut a large share of ad-monetizable devices for no technical benefit - all Godot 4.x + Unity Ads features work on 24. Change android/build.gradle.min_sdk in projects.json-driven overlay if you must."
