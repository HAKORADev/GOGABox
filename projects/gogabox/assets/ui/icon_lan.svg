<?xml version="1.0" encoding="UTF-8"?>
<!-- GOGABox LAN seat icon v042-1: the one-guy (the profile's own figure,
     redrawn properly - round head, soft shoulders, arms joined to the
     body) + the plus. The v042 drawn body was a stiff box - this is the
     real art the owner asked for ("make it first in svg then use it"). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g fill="#ffffff" fill-opacity="0.94">
    <!-- the plus, top-left -->
    <rect x="8" y="22" width="26" height="8" rx="4"/>
    <rect x="17" y="13" width="8" height="26" rx="4"/>
    <!-- the one-guy -->
    <!-- head: proper round -->
    <circle cx="60" cy="36" r="14"/>
    <!-- body: soft shoulders, gentle waist, merged arms -->
    <path d="M 60 49
             C 48 49 41 57 40 68
             L 39 84
             C 39 87 41 89 44 89
             L 76 89
             C 79 89 81 87 81 84
             L 80 68
             C 79 57 72 49 60 49 Z"/>
    <!-- arms: rounded strokes joined at the shoulders, angled outward -->
    <path d="M 44 53 C 39 55 35 60 33 66 L 31 72 C 30 75 32 77 35 76 L 40 74 C 43 72 45 68 46 64 Z"/>
    <path d="M 76 53 C 81 55 85 60 87 66 L 89 72 C 90 75 88 77 85 76 L 80 74 C 77 72 75 68 74 64 Z"/>
  </g>
</svg>
