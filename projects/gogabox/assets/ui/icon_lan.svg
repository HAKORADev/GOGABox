<?xml version="1.0" encoding="UTF-8"?>
<!-- GOGABox LAN seat icon v042-1 r2: THE OWNER'S SHAPE ("the icon at
     main menu supposed to show normal circle and an arch-like curve as
     the body and plus sign at top left"). Round head + one arch body +
     the plus badge top-left. Nothing else - no arms, no waist, no legs.
     This same geometry minus the plus is the profile placeholder face
     (LanProfile.paint_pfp), yellow on the brown plate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g fill="#ffffff" fill-opacity="0.94">
    <!-- the plus, top-left -->
    <rect x="7" y="21" width="25" height="8" rx="4"/>
    <rect x="15.5" y="12.5" width="8" height="25" rx="4"/>
    <!-- the body: one arch, flat at the bottom edge -->
    <path d="M 28.4 96 A 33.6 33.6 0 0 1 95.6 96 Z"/>
    <!-- the head: a proper round circle floating over the arch -->
    <circle cx="62" cy="30" r="24"/>
  </g>
</svg>
